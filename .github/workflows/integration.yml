name: Functional Tests

on:
  push:
    branches: [ci/bitcoin-core-32.1]

permissions:
  contents: read

jobs:
  build-electrs:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: romanz/electrs
          ref: d0aa1c30b6f5285f01d89ff6c85e8a6046b226ee
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev

      - name: Build and package Electrs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d0aa1c30b6f5285f01d89ff6c85e8a6046b226ee
          rustup toolchain install 1.88.0 --profile minimal --component cargo
          cargo +1.88.0 build --release --locked
          target/release/electrs --version
          name=electrs-v0.12.1-x86_64-linux-gnu
          mkdir "$name"
          cp target/release/electrs LICENSE "$name/"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          printf '::notice title=Electrs archive SHA-256::%s\n' "$(cat "$name.tar.gz.sha256")"

      - uses: actions/upload-artifact@v4
        with:
          name: electrs-v0.12.1-linux-x86_64
          path: |
            electrs-v0.12.1-x86_64-linux-gnu.tar.gz
            electrs-v0.12.1-x86_64-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  functional-tests:
    needs: build-electrs
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # NOTE: uncomment this to enable docker
    # container:
    #   image: rust:1-bookworm

    strategy:
      fail-fast: false
      matrix:
        include:
          - USE_TAPROOT: 0
            BITCOIN_BACKEND_TYPE: 'electrs'
          - USE_TAPROOT: 1
            BITCOIN_BACKEND_TYPE: 'electrs'

    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      EXECUTOR_WORKERS: 3
      VERBOSE: 0
      LOG_LEVEL: debug
      TIMEOUT: 120
      USE_MIN_BITCOIN_VERSION: ${{ matrix.USE_MIN_BITCOIN_VERSION }}
      USE_TAPROOT: ${{ matrix.USE_TAPROOT }}
      BITCOIN_BACKEND_TYPE: ${{ matrix.BITCOIN_BACKEND_TYPE }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: electrs-v0.12.1-linux-x86_64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component cargo
          cargo --version

      # NOTE: uncomment this if docker enabled
      # - name: Install system dependencies
      #   run: |
      #     apt update
      #     apt install -y python3 python3-pip unzip curl

      - name: cleanup /tmp
        run: |
          find /tmp -maxdepth 1 -type d -name 'lianad*' -mtime +0 -exec rm -rf {} +

      - name: Setup Python dependencies
        run: |
          rm -rf .venv
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache target/
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Build lianad and taproot_signer
        run: |
          cd lianad
          cargo build --locked --release
          cd ../tests/tools/taproot_signer
          cargo build --locked --release

      - name: Prepare and run functional tests
        run: |
          set -xe

          if [ "$USE_MIN_BITCOIN_VERSION" = "TRUE" ]; then
            curl -O https://bitcoincore.org/bin/bitcoin-core-24.0.1/bitcoin-24.0.1-x86_64-linux-gnu.tar.gz
            echo "49df6e444515d457ea0b885d66f521f2a26ca92ccf73d5296082e633544253bf bitcoin-24.0.1-x86_64-linux-gnu.tar.gz" | sha256sum -c
            tar -xzf bitcoin-24.0.1-x86_64-linux-gnu.tar.gz
            export BITCOIND_PATH=bitcoin-24.0.1/bin/bitcoind
            export IS_NOT_BITCOIND_24=0
          else
            curl -O https://bitcoincore.org/bin/bitcoin-core-32.1/bitcoin-32.1-x86_64-linux-gnu.tar.gz
            echo "61545c17c3120fb7412f896d248b11993af04ec8817aad3649c55b2afb044963 bitcoin-32.1-x86_64-linux-gnu.tar.gz" | sha256sum -c
            tar -xzf bitcoin-32.1-x86_64-linux-gnu.tar.gz
            export BITCOIND_PATH=bitcoin-32.1/bin/bitcoind
          fi

          name=electrs-v0.12.1-x86_64-linux-gnu
          sha256sum -c "$name.tar.gz.sha256"
          printf '::notice title=Tested Electrs archive SHA-256::%s\n' "$(cat "$name.tar.gz.sha256")"
          tar -xzf "$name.tar.gz"
          export ELECTRS_PATH="$PWD/$name/electrs"
          export ELECTRS_USE_REST=1
          "$ELECTRS_PATH" --version

          curl -LO https://github.com/wizardsardine/liana/releases/download/0.3.1/liana-0.3.1-x86_64-linux-gnu.tar.gz
          echo "70c8595554b6f78ccc7b66ef5f5ebc5bac03a7b1ce28afe8a076f69adf59c583 liana-0.3.1-x86_64-linux-gnu.tar.gz" | sha256sum -c
          tar -xzf liana-0.3.1-x86_64-linux-gnu.tar.gz
          export OLD_LIANAD_PATH="$PWD/liana-0.3.1-x86_64-linux-gnu/lianad"

          # Clean Cargo index before cache save
          rm -rf ~/.cargo/registry/index

          # Run the functional tests
          LIANAD_PATH=$PWD/target/release/lianad .venv/bin/pytest tests/ -vv -n 4 -ra
