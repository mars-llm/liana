name: Managed Bitcoin Core installation

on:
  push:
    branches: [ci/bitcoin-core-32.1]

permissions:
  contents: read

jobs:
  install-and-upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: x86_64-linux-gnu.tar.gz
          - runner: macos-15
            archive: arm64-apple-darwin.tar.gz
          - runner: macos-15-intel
            archive: x86_64-apple-darwin.tar.gz
          - runner: windows-2022
            archive: win64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component cargo
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libfontconfig1-dev
      - name: Install and upgrade a managed Regtest node
        run: python .github/qa/run-managed-core.py ${{ matrix.archive }}
